name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check
      continue-on-error: true

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
      continue-on-error: true

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Build release
      run: cargo build --release --verbose

    - name: Build examples
      run: cargo build --examples --verbose

  build-versions:
    name: Test llama.cpp ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: b7035
            has_vocab_api: true
          - version: b7000
            has_vocab_api: true
          - version: b6739
            has_vocab_api: true
          - version: b6500
            has_vocab_api: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build with llama.cpp ${{ matrix.version }}
      run: cargo build --verbose
      env:
        LLAMA_CPP_VERSION: ${{ matrix.version }}

    - name: Run tests with llama.cpp ${{ matrix.version }}
      run: cargo test --verbose
      env:
        LLAMA_CPP_VERSION: ${{ matrix.version }}

    - name: Verify version features are enabled
      run: |
        echo "Testing that conditional compilation works correctly"
        # The build should have emitted the correct cfg flags
        if [ "${{ matrix.has_vocab_api }}" = "true" ]; then
          echo "✓ This version should have llama_vocab_api cfg"
        else
          echo "✓ This version should NOT have llama_vocab_api cfg"
        fi
      env:
        LLAMA_CPP_VERSION: ${{ matrix.version }}

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build docs
      run: cargo doc --no-deps --all-features

  check-minimal-versions:
    name: Check with minimal dependency versions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-hack
      run: cargo install cargo-hack

    - name: Check with minimal versions
      run: cargo hack check --all --all-features --version-range 1.70..
      continue-on-error: true
